<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AI Script to Video Studio</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    textarea { width: 100%; height: 100px; margin-bottom: 10px; }
    button { padding: 10px 20px; background: #0070f3; color: white; border: none; cursor: pointer; }
    #result { margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Tạo Video từ Kịch Bản AI</h2>
  <textarea id="scriptInput" placeholder="Nhập kịch bản của bạn vào đây..."></textarea>
  <button onclick="createVideo()">Tạo Video Thật</button>

  <div id="status"></div>
  <div id="result"></div>

  <script>
    async function createVideo() {
      const script = document.getElementById('scriptInput').value;
      const statusDiv = document.getElementById('status');
      const resultDiv = document.getElementById('result');

      if (!script) return alert('Vui lòng nhập kịch bản!');

      statusDiv.innerHTML = 'Đang phân tích kịch bản & gửi lệnh tạo video...';
      resultDiv.innerHTML = '';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script })
        });

        const data = await response.json();
        if (data.success) {
          statusDiv.innerHTML = `Đã tạo Task thành công! Prompt: <i>"${data.promptUsed}"</i><br>Đang chờ AI render video (Task ID: ${data.predictionId})...`;
          // Tại đây bạn có thể viết hàm setInterval để kiểm tra xem video đã render xong chưa
        } else {
          statusDiv.innerHTML = 'Lỗi: ' + data.error;
        }
      } catch (err) {
        statusDiv.innerHTML = 'Lỗi kết nối Server.';
      }
    }
  </script>
</body>
</html>
